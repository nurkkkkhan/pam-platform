# Development dependencies. Application services are added in milestones M2–M3.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
      POSTGRES_DB: pam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-CHANGE_ME}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME_LONG}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-CHANGE_ME}
    ports: ["8081:8080"]
  target-linux-1:          # test target with sshd
    image: lscr.io/linuxserver/openssh-server:latest
    environment: { USER_NAME: deploy, PASSWORD_ACCESS: "true", USER_PASSWORD: CHANGE_ME }
  target-pg-1:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: CHANGE_ME }
volumes: { pgdata: {}, miniodata: {} }
